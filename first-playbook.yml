
---
- name: Create user and ssh
  hosts: all
  tasks:
  - name: Create a user
    ansible.builtin.user:
     # reference -> https://docs.ansible.com/projects/ansible/latest/collections/ansible/builtin/user_module.html#ansible-collections-ansible-builtin-user-module
      name: test-user-2
      create-home: 'yes'
    become: yes
  - name: Create ssh directory to put private key in authorized_keys
    ansible.builtin.file:
    # reference -> https://docs.ansible.com/projects/ansible/latest/collections/ansible/builtin/file_module.html#examples
      path: /home/test-user-2/.ssh
      state: directory
      owner: test-user-2
      group: test-user-2
      mode: '0704'
    become: yes
  - name: Paste the public key in authorized_keys
    ansible.posix.authorized_keys:
      user: test-user-2
      state: present
      key: '{{ lookup(''file'', ''/Users/veshalik/.ssh/id_ed25519.pub'') }}'
    become: yes
  - name: Ensure SSH service is running
    ansible.builtin.service:
      name: sshd
      state: started
      enabled: 'yes'
